bundle:
  name: jj-hr-digital-demo

sync:
  include:
    - .env

variables:
  catalog:
    description: Unity Catalog catalog name
    default: bldemos
  schema:
    description: Unity Catalog schema name
    default: hrd_2030
  warehouse_id:
    description: SQL Warehouse ID
    default: "e3813489efa8de68"
  app_name:
    description: Databricks App name
    default: hire-right-agent-app
  vs_endpoint_name:
    description: Vector Search endpoint name
    default: bx4_hrd_vs_endpoint
  model_endpoint_name:
    description: ML model serving endpoint name
    default: hr-predictive-hiring-endpoint
  agent_endpoint_name:
    description: Agent serving endpoint name
    default: hire-right-agent-endpoint
  llm_endpoint_name:
    description: LLM serving endpoint (via AI Gateway)
    default: databricks-gpt-5-4
  mlflow_experiment:
    description: MLflow experiment name for the ML model (notebook 05)
    default: ml-hr-predictive-hiring-evals
  agent_mlflow_experiment:
    description: Legacy (experiment-storage) agent experiment — traces are migrated from here by notebook 06a
    default: agent-predictive-hiring-evals
  agent_uc_experiment:
    description: UC-linked MLflow experiment for agent traces (created by notebook 06a, used by notebook 06)
    default: hrd-agent-traces
  trace_catalog:
    description: UC catalog holding the agent's OpenTelemetry trace tables
    default: bldemos
  trace_schema:
    description: UC schema holding the agent's OpenTelemetry trace tables
    default: hrd_2030_agent_observability
  trace_table_prefix:
    description: Prefix of the trace tables (<prefix>_otel_spans, _logs, _metrics, _annotations)
    default: hrd_agent
  app_log_schema:
    description: UC schema the Databricks App exports its OpenTelemetry logs/metrics/spans to (app telemetry)
    default: hrd_2030_app_observability
  app_log_table_prefix:
    description: Prefix of the app telemetry tables (<prefix>_otel_logs, _metrics, _spans)
    default: hrd_app
  agent_sp_name:
    description: Service principal the agent endpoint runs as (created by scripts/setup_agent_sp.sh)
    default: hire-right-agent-sp
  agent_secret_scope:
    description: Secret scope holding the agent SP's OAuth credentials (sp-client-id, sp-client-secret)
    default: hire-right-agent
  agent_name:
    description: Registered model name for the agent
    default: agent-hire_right
  ml_model_name:
    description: Registered model name for the ML hiring model
    default: ml_hr_predictive_hiring
  genie_space_id:
    description: Genie Space ID for HR analytics (set after space is created in UI or notebook 04)
    default: "01f170b7d5dc143995f2df49ee1fbc22"
  lakebase_instance_name:
    description: Lakebase (Postgres) instance name backing the app
    default: hire-right-lb
  lakebase_database:
    description: Lakebase Postgres database that holds synced tables + annotations
    default: databricks_postgres
  lakebase_catalog:
    description: UC catalog (Postgres-backed) exposing the synced tables (no hyphens)
    default: hrd_2030_lakebase

resources:
  dashboards:
    hiring_analytics:
      display_name: "Jackson and Jackson HR Digital — Hiring Analytics"
      file_path: ./dashboard/hiring_analytics.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: "/Workspace/Users/${workspace.current_user.userName}"

  # ── Databricks App ───────────────────────────────────────────────────────────
  # Deployed the preferred (declarative) way: `bundle deploy` provisions the app
  # AND attaches the service-principal resource bindings below, so the app can
  # query the agent endpoint, use the warehouse, run Genie, and connect to
  # Lakebase — no post-deploy PATCH needed.
  apps:
    hire_right_app:
      name: ${var.app_name}
      description: "Hire Right — AI-powered predictive hiring for Jackson & Jackson HR Digital."
      source_code_path: ./app
      config:
        command:
          - uvicorn
          - app:app
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
          - --timeout-keep-alive
          - "600"
        env:
          - name: DATABRICKS_AGENT_ENDPOINT
            value: ${var.agent_endpoint_name}
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql_warehouse
          - name: GENIE_SPACE_ID
            value: ${var.genie_space_id}
          - name: LLM_ENDPOINT
            value: ${var.llm_endpoint_name}
          - name: TARGET_CATALOG
            value: ${var.catalog}
          - name: TARGET_SCHEMA
            value: ${var.schema}
          - name: LAKEBASE_INSTANCE_NAME
            value: ${var.lakebase_instance_name}
          - name: LAKEBASE_DATABASE
            value: ${var.lakebase_database}
          - name: PG_SCHEMA
            value: ${var.schema}
      resources:
        - name: agent_endpoint
          serving_endpoint:
            name: ${var.agent_endpoint_name}
            permission: CAN_QUERY
        - name: sql_warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie_space
          genie_space:
            name: "Jackson and Jackson HR Digital — Hiring Analytics Genie"
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: lakebase_db
          database:
            instance_name: ${var.lakebase_instance_name}
            database_name: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
      # App telemetry (OTel logs/metrics/spans → UC). Keep in the bundle so deploys don't clear it.
      telemetry_export_destinations:
        - unity_catalog:
            logs_table: ${var.catalog}.${var.app_log_schema}.${var.app_log_table_prefix}_otel_logs
            metrics_table: ${var.catalog}.${var.app_log_schema}.${var.app_log_table_prefix}_otel_metrics
            traces_table: ${var.catalog}.${var.app_log_schema}.${var.app_log_table_prefix}_otel_spans
      permissions:
        - level: CAN_USE
          group_name: users
        - level: CAN_MANAGE
          user_name: jeff.shmain@databricks.com

  jobs:
    hrd_setup_job:
      name: jj-hr-digital-pipeline
      tags:
        BU: CBT-HR
        Team: HRD
        Project: HR-2030
        UseCase: Hire-Right-Agent
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: train_model
          default: "false"
        - name: deploy_agent
          default: "false"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00a_setup_schema_volume.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume_name: raw_data

        - task_key: load_bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_load_bronze.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume_name: raw_data

        - task_key: load_silver
          depends_on:
            - task_key: load_bronze
          notebook_task:
            notebook_path: ./notebooks/01_load_silver.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_vector_index_rag
          depends_on:
            - task_key: load_bronze
          notebook_task:
            notebook_path: ./notebooks/01b_build_vector_search.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume_name: raw_data
              vs_endpoint_name: ${var.vs_endpoint_name}
              vs_index_name: hr_resumes_vs_index

        - task_key: classify_and_quality
          depends_on:
            - task_key: load_silver
          notebook_task:
            notebook_path: ./notebooks/02_apply_data_quality_and_classification.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: build_gold
          depends_on:
            - task_key: classify_and_quality
          notebook_task:
            notebook_path: ./notebooks/03_build_gold.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: setup_lakebase
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ./notebooks/10_setup_lakebase.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              lakebase_instance_name: ${var.lakebase_instance_name}
              lakebase_database: ${var.lakebase_database}
              lakebase_catalog: ${var.lakebase_catalog}

        - task_key: create_uc_functions
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ./notebooks/04b_create_uc_functions.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: apply_business_semantics
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ./notebooks/03b_apply_business_semantics.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: genie_space
          depends_on:
            - task_key: apply_business_semantics
          notebook_task:
            notebook_path: ./notebooks/04_create_genie_space.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}

        - task_key: train_condition
          depends_on:
            - task_key: genie_space
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.train_model}}"
            right: "true"

        - task_key: ml_model
          depends_on:
            - task_key: train_condition
              outcome: "true"
          notebook_task:
            notebook_path: ./notebooks/05_train_ml_model.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              mlflow_experiment: ${var.mlflow_experiment}
              model_name: ${var.ml_model_name}
              endpoint_name: ${var.model_endpoint_name}

        - task_key: deploy_app
          depends_on:
            - task_key: agent
            - task_key: setup_lakebase
          notebook_task:
            notebook_path: ./notebooks/07_deploy_app.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              agent_endpoint_name: ${var.agent_endpoint_name}
              warehouse_id: ${var.warehouse_id}
              app_name: ${var.app_name}
              genie_space_id: "{{tasks.genie_space.values.genie_space_id}}"
              lakebase_instance_name: ${var.lakebase_instance_name}
              lakebase_database: ${var.lakebase_database}

        - task_key: drift_monitor
          depends_on:
            - task_key: deploy_app
            - task_key: ml_model
          notebook_task:
            notebook_path: ./notebooks/05b_create_drift_monitor.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              endpoint_name: ${var.model_endpoint_name}
              warehouse_id: ${var.warehouse_id}

        - task_key: app_log_views
          depends_on:
            - task_key: deploy_app
          notebook_task:
            notebook_path: ./notebooks/13_app_log_analytics_views.ipynb
            base_parameters:
              app_log_catalog: ${var.catalog}
              app_log_schema: ${var.app_log_schema}
              app_log_table_prefix: ${var.app_log_table_prefix}

        - task_key: app_log_genie_agent
          depends_on:
            - task_key: app_log_views
          notebook_task:
            notebook_path: ./notebooks/14_create_app_log_genie_agent.ipynb
            base_parameters:
              app_log_catalog: ${var.catalog}
              app_log_schema: ${var.app_log_schema}
              app_log_table_prefix: ${var.app_log_table_prefix}
              warehouse_id: ${var.warehouse_id}

        - task_key: grant_app_permissions
          depends_on:
            - task_key: deploy_app
          notebook_task:
            notebook_path: ./notebooks/09_grant_app_permissions.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              app_name: ${var.app_name}
              genie_space_id: "{{tasks.genie_space.values.genie_space_id}}"
              warehouse_id: ${var.warehouse_id}
              agent_endpoint_name: ${var.agent_endpoint_name}

        - task_key: agent_condition
          depends_on:
            - task_key: genie_space
            - task_key: build_vector_index_rag
            - task_key: create_uc_functions
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.deploy_agent}}"
            right: "true"

        - task_key: setup_uc_tracing
          depends_on:
            - task_key: agent_condition
              outcome: "true"
          notebook_task:
            notebook_path: ./notebooks/06a_setup_uc_tracing.ipynb
            base_parameters:
              trace_catalog: ${var.trace_catalog}
              trace_schema: ${var.trace_schema}
              trace_table_prefix: ${var.trace_table_prefix}
              uc_experiment: ${var.agent_uc_experiment}
              source_experiment: ${var.agent_mlflow_experiment}
              warehouse_id: ${var.warehouse_id}

        - task_key: trace_analytics_views
          depends_on:
            - task_key: setup_uc_tracing
          notebook_task:
            notebook_path: ./notebooks/11_trace_analytics_views.ipynb
            base_parameters:
              trace_catalog: ${var.trace_catalog}
              trace_schema: ${var.trace_schema}
              trace_table_prefix: ${var.trace_table_prefix}

        - task_key: trace_genie_agent
          depends_on:
            - task_key: trace_analytics_views
          notebook_task:
            notebook_path: ./notebooks/12_create_trace_genie_agent.ipynb
            base_parameters:
              trace_catalog: ${var.trace_catalog}
              trace_schema: ${var.trace_schema}
              warehouse_id: ${var.warehouse_id}

        - task_key: agent
          depends_on:
            - task_key: setup_uc_tracing
          notebook_task:
            notebook_path: ./notebooks/06_evaluate_register_agent.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              genie_space_id: "{{tasks.genie_space.values.genie_space_id}}"
              vs_index_name: hr_resumes_vs_index
              vs_endpoint_name: ${var.vs_endpoint_name}
              model_endpoint_name: ${var.model_endpoint_name}
              agent_name: ${var.agent_name}
              agent_endpoint_name: ${var.agent_endpoint_name}
              llm_endpoint: ${var.llm_endpoint_name}
              mlflow_experiment: ${var.agent_uc_experiment}
              warehouse_id: ${var.warehouse_id}
              agent_sp_name: ${var.agent_sp_name}
              secret_scope: ${var.agent_secret_scope}

        - task_key: refresh_dashboard
          depends_on:
            - task_key: apply_business_semantics
          notebook_task:
            notebook_path: ./notebooks/08_refresh_dashboard.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              dashboard_name: "Jackson and Jackson HR Digital — Hiring Analytics"

targets:
  prod:
    mode: production
    workspace:
      host: https://fevm-stable-classic-zso77x-bx3.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  default:
    mode: development
    default: true
    workspace:
      host: https://fevm-bobertx3-aws-fevm.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
